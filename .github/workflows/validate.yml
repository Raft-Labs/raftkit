name: validate

on:
  pull_request:
    # explicit list because `edited` (fires on base-branch retarget) is not a default type
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

env:
  CLAUDE_CLI_VERSION: 2.1.209

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the version-bump gate anchors at the merge base

      # Catches raw JSON syntax errors even if the CLI install below fails.
      # Never a substitute for the CLI validate — that step is the authority.
      - name: JSON syntax pre-check
        run: |
          jq empty .claude-plugin/marketplace.json
          for f in plugins/*/.claude-plugin/plugin.json; do jq empty "$f"; done

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache Claude Code CLI
        id: cli-cache
        uses: actions/cache@v4
        with:
          path: ~/.npm-global
          key: claude-cli-${{ env.CLAUDE_CLI_VERSION }}

      - name: Install Claude Code CLI (pinned)
        if: steps.cli-cache.outputs.cache-hit != 'true'
        run: npm install -g --prefix "$HOME/.npm-global" "@anthropic-ai/claude-code@$CLAUDE_CLI_VERSION"

      - name: Add CLI to PATH
        run: echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"

      - name: CLI smoke check # asserts the cached CLI matches the pin
        run: claude --version | grep -F "$CLAUDE_CLI_VERSION"

      - name: Validate marketplace and manifests
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash scripts/validate.sh

      - name: Run all contract test suites
        run: |
          failures=0
          for t in tests/*.test.sh; do
            # Opt-in network suite (RUN_NETWORK_TESTS=1) — makes real installs
            # against the live registry; not run in CI.
            if [[ "$(basename "$t")" == "capability-preflight-network.test.sh" ]]; then
              echo "SKIP  $t (network, opt-in — see file header)"
              continue
            fi
            echo "::group::$t"
            if bash "$t"; then
              echo "PASS  $t"
            else
              echo "FAIL  $t"
              failures=$((failures + 1))
            fi
            echo "::endgroup::"
          done
          echo
          if [[ "$failures" -gt 0 ]]; then
            echo "$failures suite(s) failed"
            exit 1
          fi
          echo "all contract suites passed"
