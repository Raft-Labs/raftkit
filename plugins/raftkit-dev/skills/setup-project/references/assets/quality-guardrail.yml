# RaftLabs governance CI quality guardrail — installed by raftkit-dev/setup-project.
# Managed file: overwritten on the next setup-project run.
name: Quality guardrail
on:
  pull_request:
jobs:
  guardrail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run --if-present lint
      - run: npm run --if-present typecheck
      - run: npm run --if-present test
